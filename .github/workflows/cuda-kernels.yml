name: cuda-kernels

on:
  pull_request:
  workflow_dispatch:

jobs:
  cpu-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile peer_grkan_kernels.py tests/test_peer_grkan_kernels.py benchmarks/autotune_peer_grkan.py
      - run: python -m unittest discover -s tests -q

  cuda-tests:
    # Requires your own GPU runner labels.
    runs-on: [self-hosted, linux, x64, cuda]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install torch/triton (example)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.4.1 triton==3.0.0
      - name: Run unit tests (includes CUDA-gated Triton tests)
        run: python -m unittest discover -s tests -q
      - name: Run autotune quick smoke (torch backend)
        run: python benchmarks/autotune_peer_grkan.py --device cuda --backend torch --iters 5 --save-profile artifacts/profile-torch.json
      - name: Run autotune quick smoke (auto backend)
        run: python benchmarks/autotune_peer_grkan.py --device cuda --backend auto --iters 5 --save-profile artifacts/profile-auto.json
      - name: Run autotune quick smoke (triton_fused backend)
        run: python benchmarks/autotune_peer_grkan.py --device cuda --backend triton_fused --iters 5 --save-profile artifacts/profile-triton-fused.json
      - name: Upload autotune profiles
        uses: actions/upload-artifact@v4
        with:
          name: cuda-autotune-profiles
          path: artifacts/*.json
